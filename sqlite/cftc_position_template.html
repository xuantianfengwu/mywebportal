<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{title} | 标签置顶超大间距柱状图 · 微软雅黑</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {{ margin: 0; padding: 0; box-sizing: border-box; }}
        body {{
            background: #eef2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: '微软雅黑', 'Microsoft YaHei', sans-serif;
            padding: 32px 24px;
        }}
        .chart-container-wrapper {{
            max-width: 1400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }}
        .card {{
            background: #fff;
            border-radius: 40px;
            box-shadow: 0 28px 44px -16px rgba(0,0,0,0.2);
            overflow: hidden;
            padding: 32px;
        }}
        .chart-container {{ width: 100%; }}
        #chart {{ width: 100%; height: 700px; }}
        .remarks {{
            margin-top: 16px;
            background: #f8fbfe;
            border-radius: 32px;
            padding: 24px 32px;
            border: 1px solid #eef3fc;
            font-size: 20px;
            color: #3f6e92;
        }}
        .remarks h4 {{
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1f4e7a;
            font-family: '微软雅黑', 'Microsoft YaHei', sans-serif;
        }}
        .remarks p {{ margin: 10px 0; line-height: 1.6; font-size: 20px; }}
        .legend-color {{
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 10px;
            vertical-align: middle;
        }}
        .footer-hint {{
            text-align: center;
            font-size: 20px;
            font-family: '微软雅黑', 'Microsoft YaHei', sans-serif;
            color: #2a5f82;
            background: #eef3fc;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
        }}
    </style>
</head>
<body>
<div class="chart-container-wrapper">
    <div class="card">
        <div class="chart-container">
            <div id="chart"></div>
        </div>
        <div class="remarks">
            <h4>{remarks_title}</h4>
            <p>{remarks_text1}<br>{remarks_text2}<br>• <span class="legend-color" style="background:#8BA3C7;"></span> {legend_last}　<span class="legend-color" style="background:#2C5F8A;"></span> {legend_this}</p>
            <p>• 🎯 {remarks_text3}</p>
        </div>
    </div>
    <div class="footer-hint">{footer_text}</div>
</div>
<script>
    const currencies = {currencies!r};
    const lastWeekRawData = {last_week_data};
    const thisWeekRawData = {this_week_data};
    
    const processDataWithLabel = (data) => {{
        return data.map(value => {{
            const isPositive = value >= 0;
            return {{
                value: value,
                label: {{
                    show: true,
                    formatter: value.toLocaleString(),
                    fontSize: 14,
                    fontWeight: 'bold',
                    fontFamily: '微软雅黑',
                    position: isPositive ? 'top' : 'bottom',
                    offset: isPositive ? [0, 4] : [0, -4]
                }}
            }};
        }});
    }};
    
    const lastWeek = processDataWithLabel(lastWeekRawData);
    const thisWeek = processDataWithLabel(thisWeekRawData);
    const allData = [...lastWeekRawData, ...thisWeekRawData];
    const yMin = {y_min};
    const yMax = {y_max};
    
    const chart = echarts.init(document.getElementById('chart'));
    chart.setOption({{
        backgroundColor: '#ffffff',
        title: {{
            text: '{title_text}',
            left: 'center',
            top: 20,
            textStyle: {{ fontSize: 28, fontWeight: 700, color: '#1f3a4b', fontFamily: '微软雅黑' }}
        }},
        toolbox: {{
            show: true,
            feature: {{
                saveAsImage: {{ title: '保存图片', backgroundColor: '#fff', pixelRatio: 2 }},
                restore: {{ title: '重置' }}
            }},
            right: 30,
            top: 30,
            iconSize: 24
        }},
        legend: {{
            data: ['{legend_last}', '{legend_this}'],
            left: 'center',
            top: 100,
            textStyle: {{ fontSize: 16, color: '#2c4f6e', fontFamily: '微软雅黑', fontWeight: 500 }},
            itemWidth: 24,
            itemHeight: 14,
            borderRadius: 4
        }},
        grid: {{
            left: '8%', right: '8%', top: '22%', bottom: '10%',
            containLabel: true, backgroundColor: '#fefefe'
        }},
        xAxis: {{
            type: 'category',
            data: currencies,
            axisTick: {{ show: false }},
            axisLine: {{ lineStyle: {{ color: '#9bb0c5', width: 2 }} }},
            axisLabel: {{ fontSize: 18, fontWeight: 600, color: '#1f496e', fontFamily: '微软雅黑', margin: 12 }}
        }},
        yAxis: {{
            type: 'value',
            name: '{y_axis_name}',
            nameTextStyle: {{ fontSize: 16, color: '#4f7396', fontFamily: '微软雅黑', fontWeight: 500 }},
            splitLine: {{ lineStyle: {{ color: '#e2e9f2', type: 'dashed', width: 1.5 }} }},
            axisLabel: {{ fontSize: 14, fontFamily: '微软雅黑', fontWeight: 500, formatter: (v) => v.toLocaleString() }},
            min: yMin, max: yMax,
            axisLine: {{ show: false }}, axisTick: {{ show: false }}
        }},
        tooltip: {{
            trigger: 'axis',
            axisPointer: {{ type: 'shadow' }},
            backgroundColor: 'rgba(255,255,240,0.96)',
            borderColor: '#2c5f8a', borderWidth: 2,
            textStyle: {{ fontSize: 14, fontFamily: '微软雅黑' }},
            formatter: (params) => {{
                let res = `<strong style="font-size:16px;">${{params[0].axisValue}}</strong><br/>`;
                params.forEach(p => {{
                    res += `<span style="display:inline-block;margin-right:8px;border-radius:50%;width:12px;height:12px;background:${{p.color}};"></span>`;
                    res += `${{p.seriesName}}: <b>${{p.value.toLocaleString()}}</b> 万手<br/>`;
                }});
                return res;
            }}
        }},
        series: [
            {{
                name: '{legend_last}',
                type: 'bar', data: lastWeek,
                barWidth: '32%', barCategoryGap: '50%',
                borderRadius: [6, 6, 0, 0],
                itemStyle: {{ color: '#8BA3C7', borderRadius: [6, 6, 0, 0], shadowBlur: 3, shadowColor: 'rgba(0,0,0,0.15)' }}
            }},
            {{
                name: '{legend_this}',
                type: 'bar', data: thisWeek,
                barWidth: '32%', barCategoryGap: '50%',
                borderRadius: [6, 6, 0, 0],
                itemStyle: {{ color: '#2C5F8A', borderRadius: [6, 6, 0, 0], shadowBlur: 3, shadowColor: 'rgba(0,0,0,0.15)' }}
            }}
        ]
    }});
    
    window.addEventListener('resize', () => chart.resize());
    setTimeout(() => chart.resize(), 120);
</script>
</body>
</html>
